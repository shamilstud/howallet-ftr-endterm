# Grafana: anonymous Admin (LAB ONLY), provisioned Prometheus datasource and
# the "hoWallet API - Endterm" dashboard (uid howallet-endterm).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: university
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.university.svc.cluster.local:9090
        isDefault: true
        uid: prometheus
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: endterm
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: university
data:
  howallet-endterm.json: |
    {
      "uid": "howallet-endterm",
      "title": "hoWallet API – Endterm",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "5s",
      "time": { "from": "now-15m", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by status class",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum by (status) (rate(http_requests_total{job=\"api\"}[1m]))", "legendFormat": "{{status}}", "refId": "A" } ]
        },
        {
          "id": 2, "type": "stat", "title": "Error rate %",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percent", "thresholds": { "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 5 } ] } } },
          "targets": [ { "expr": "100 * sum(rate(http_requests_total{job=\"api\",status=~\"5..\"}[1m])) / clamp_min(sum(rate(http_requests_total{job=\"api\"}[1m])), 1)", "refId": "A" } ]
        },
        {
          "id": 3, "type": "stat", "title": "In-flight requests",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "sum(http_requests_in_flight{job=\"api\"})", "refId": "A" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Latency p50 / p95 / p99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[1m])))", "legendFormat": "p50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[1m])))", "legendFormat": "p95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"api\"}[1m])))", "legendFormat": "p99", "refId": "C" }
          ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Replicas up (per instance)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "min": 0, "max": 1 } },
          "targets": [ { "expr": "up{job=\"api\"}", "legendFormat": "{{instance}}", "refId": "A" } ]
        },
        {
          "id": 6, "type": "table", "title": "Firing alerts",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [ { "expr": "ALERTS{alertstate=\"firing\"}", "format": "table", "instant": true, "refId": "A" } ]
        },
        {
          "id": 7, "type": "timeseries", "title": "DB pool connections (may be absent)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "db_pool_acquired_conns", "legendFormat": "acquired {{instance}}", "refId": "A" },
            { "expr": "db_pool_total_conns", "legendFormat": "total {{instance}}", "refId": "B" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: university
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana, tier: monitoring }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED,  value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM,  value: "true" }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
          volumeMounts:
            - { name: provisioning-ds,  mountPath: /etc/grafana/provisioning/datasources }
            - { name: provisioning-dash, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
      volumes:
        - name: provisioning-ds
          configMap:
            name: grafana-provisioning
            items: [{ key: datasource.yaml, path: datasource.yaml }]
        - name: provisioning-dash
          configMap:
            name: grafana-provisioning
            items: [{ key: dashboards.yaml, path: dashboards.yaml }]
        - name: dashboards
          configMap:
            name: grafana-dashboard
            items: [{ key: howallet-endterm.json, path: howallet-endterm.json }]
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: university
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30300 }
