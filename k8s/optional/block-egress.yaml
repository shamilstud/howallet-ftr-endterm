# Graceful-degradation experiment: cut the api's external egress (no HTTPS
# 443 to the outside), keeping only DNS and Postgres. The exchange-rate
# provider (Frankfurter) then becomes unreachable, and the app must degrade
# gracefully (a dash + an error upward, never a wrong rate).
#
# This reuses the SAME metadata.name as the api-egress policy in
# 70-network-policy.yaml, so applying it OVERWRITES the allow rule:
#   kubectl apply -f k8s/optional/block-egress.yaml
# Restore normal egress with:
#   kubectl apply -f k8s/70-network-policy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-egress
  namespace: university
spec:
  podSelector:
    matchLabels: { tier: app }
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - podSelector: { matchLabels: { app: postgres } }
      ports: [{ protocol: TCP, port: 5432 }]
    # NOTE: no port 443 rule here -> external HTTPS is blocked.
