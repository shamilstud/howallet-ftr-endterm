# Prometheus: fast scrape so failures show up within seconds. Scrapes each
# api replica individually via the headless Service's per-pod A records.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-conf
  namespace: university
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # One target per ready api pod -> up{job="api"} is per-replica.
      - job_name: api
        metrics_path: /metrics
        dns_sd_configs:
          - names: [api-headless.university.svc.cluster.local]
            type: A
            port: 8080
            refresh_interval: 2s

      # The "midterm" baseline (1 replica, no gateway) measured in parallel.
      - job_name: api-baseline
        metrics_path: /metrics
        dns_sd_configs:
          - names: [api-baseline-headless.university.svc.cluster.local]
            type: A
            port: 8080
            refresh_interval: 2s

      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]

  rules.yml: |
    groups:
      - name: api-slo
        # Scoped to job="api" (the baseline has its own job) and without the
        # kubelet /health probes, which are cheap 200s that dilute the ratio.
        rules:
          - alert: ApiHighErrorRate
            expr: sum(rate(http_requests_total{job="api",route!="/health",status=~"5.."}[30s])) / sum(rate(http_requests_total{job="api",route!="/health"}[30s])) > 0.05
            for: 10s
            labels: { severity: critical }
            annotations:
              summary: "API 5xx error rate above 5%"
              runbook: "Detects server-side failures across the API. Expected response: check pod logs and recent deploy; the gateway already returns a JSON 503 to shield clients."
          - alert: ApiHighLatencyP95
            expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api",route!="/health"}[30s]))) > 0.5
            for: 10s
            labels: { severity: warning }
            annotations:
              summary: "API p95 latency above 500ms"
              runbook: "Detects slow responses. Expected response: inspect DB pool saturation and in-flight requests; consider scaling replicas."
          # Counts healthy replicas instead of looking for up == 0: a dead or hung pod
          # leaves the headless-Service DNS within ~2 s, so its target vanishes from
          # dns_sd before up == 0 can hold for 6 s (E4 rep1: pending, never firing).
          - alert: ApiReplicaDown
            expr: (count(up{job="api"} == 1) < 2) or absent(up{job="api"} == 1)
            for: 6s
            labels: { severity: critical }
            annotations:
              summary: "Fewer than 2 API replicas are up and scrapeable"
              runbook: "A replica stopped responding to /metrics. Expected response: Kubernetes restarts/reschedules it; confirm at least 2 pods become Ready. Also watch count(up{job=\"api\"}==1) < 2."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: university
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus, tier: monitoring }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: conf,  mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data,  mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
      volumes:
        - name: conf
          configMap:
            name: prometheus-conf
            items: [{ key: prometheus.yml, path: prometheus.yml }]
        - name: rules
          configMap:
            name: prometheus-conf
            items: [{ key: rules.yml, path: rules.yml }]
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: university
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http, nodePort: 30090 }
