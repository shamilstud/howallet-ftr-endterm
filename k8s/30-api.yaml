# University API: the hoWallet Go API image playing the synthetic university
# service. Two replicas so one can fail without downtime. Hardened like A4
# (non-root, read-only rootfs, no service-account token, caps dropped).
#
# Image howallet-api:endterm is built from branch feat/metrics and exposes
# GET /metrics when METRICS_ENABLED=true. Until that image exists, up.sh
# temporarily points this Deployment at howallet-registration:ftr (no
# /metrics) so the rest of the stack can be validated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: university
  labels: { app: api }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0        # never drop below 2 ready pods during a deploy
      maxSurge: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api, tier: app }
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false   # Service "api" would inject API_PORT=tcp://..., which the app reads as its listen port
      terminationGracePeriodSeconds: 20
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: api } }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: api
          image: howallet-api:endterm
          imagePullPolicy: Never
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ secretRef: { name: university-secrets } }]
          env:
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: JWT_ACCESS_TTL, value: 24h }
            - { name: METRICS_ENABLED, value: "true" }
            - { name: SALES_PAUSED, value: "true" }   # else free-plan limits (1 household, 150 records) 403 the load tests
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }   # keep serving while kube-proxy drops the pod
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 1
            timeoutSeconds: 1
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
---
# Stable ClusterIP the gateway proxies to.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: university
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# Headless Service: one DNS A record per ready pod, so Prometheus scrapes
# each replica individually (up is per-replica).
apiVersion: v1
kind: Service
metadata:
  name: api-headless
  namespace: university
spec:
  clusterIP: None
  selector: { app: api }
  ports:
    - { name: metrics, port: 8080, targetPort: http }
